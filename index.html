<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switchboard</title>
<style>
:root{
  --bg:#04060d; --navy:#0b1226; --navy-2:#141d3a; --edge:#26335a;
  --glow:rgb(205,236,255);
  --sq-filter:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#0b1226 0%,#05070f 60%,#030409 100%);
  display:grid;place-items:center;overflow-x:hidden;
  padding:max(12px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  user-select:none;-webkit-user-select:none;
}
.stage{
  --w:min(96vw,1280px,calc((100dvh - 56px) / .86));
  width:var(--w);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vw,22px);
}
/* ---------- room ---------- */
.frame{
  width:100%;padding:1.4%;border-radius:10px;
  background:linear-gradient(160deg,#121b36,#080c19 70%);
  border:1px solid var(--edge);
  box-shadow:0 0 0 1px #02040a,0 24px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(120,150,220,.12);
}
.room{
  position:relative;width:100%;aspect-ratio:1920/1072;overflow:hidden;border-radius:4px;
  background:#05070e;box-shadow:inset 0 0 0 1px #02040a;isolation:isolate;
}
.room>img.base{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;display:block;opacity:0;pointer-events:none;
  transition:opacity .7s cubic-bezier(.3,.1,.2,1),filter .25s linear}
.layer.on{opacity:1}
.layer.sq{filter:var(--sq-filter)}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx .glow{opacity:0;transition:opacity .8s cubic-bezier(.3,.1,.2,1);mix-blend-mode:screen}
.fx .glow.on{opacity:1}
.fx .outline{fill:none;stroke:rgba(150,180,230,.30);stroke-width:1.6;transition:opacity .6s}
.fx .outline.hide{opacity:0}
.fx .stop{stop-color:var(--glow)}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,4,10,.55) 100%)}

.sw.round .face{inset:11.5%;border-radius:50%;background:#fff;

}

/* square switch */
.sw.sqr .face{left:5.5%;top:11.6%;width:81.7%;height:69.5%;border-radius:5%;background:#fff;
  box-shadow:inset 0 0 0 1.5px #e3e2ee}

}

  var room=document.getElementById('room');
  var SQ=['L2','R2','L3','R3'];
  // each switch toggles exactly its own light (per mapping schematic)
  function setLight(id,on){
    room.querySelectorAll('[data-light="'+id+'"]').forEach(function(el){el.classList.toggle('on',on)});
    room.querySelectorAll('[data-o="'+id+'"]').forEach(function(el){el.classList.toggle('hide',on)});
    var b=document.querySelector('.sw[data-light="'+id+'"]');
    b.classList.toggle('on',on);b.setAttribute('aria-checked',on?'true':'false');
  }
  document.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){
      setLight(b.dataset.light,!b.classList.contains('on'));
    });
  });

  // warmness slider -> colour temperature of the four square lights
  var board=document.getElementById('board'), slider=document.getElementById('slider'), knob=document.getElementById('knob');
  var NEUTRAL=320, MIN=150, MAX=450;          // knob-centre y in 1000x600 board units
  var ky=NEUTRAL;
  var CY0=104, SH=392;                          // slider element covers y 104..496
  function mix(a,b,t){return a+(b-a)*t}
  function apply(){
    var warm=Math.max(0,(NEUTRAL-ky)/(NEUTRAL-MIN)), cool=Math.max(0,(ky-NEUTRAL)/(MAX-NEUTRAL));
    var f=[];
    if(warm>0) f.push('sepia('+(warm*.85).toFixed(3)+')','saturate('+(1+warm*.9).toFixed(3)+')','hue-rotate('+(-warm*6).toFixed(1)+'deg)','brightness('+(1+warm*.05).toFixed(3)+')');
    if(cool>0) f.push('hue-rotate('+(cool*14).toFixed(1)+'deg)','saturate('+(1+cool*.6).toFixed(3)+')');
    document.documentElement.style.setProperty('--sq-filter',f.length?f.join(' '):'none');
    var c;
    if(warm>0) c=[mix(205,255,warm),mix(236,190,warm),mix(255,112,warm)];
    else c=[mix(205,140,cool),mix(236,212,cool),255];
    document.documentElement.style.setProperty('--glow','rgb('+c.map(Math.round).join(',')+')');
    knob.style.top=((ky-42.5-CY0)/SH*100)+'%';
    slider.setAttribute('aria-valuenow',Math.round((warm-cool)*100));
  }
  function units(e){var r=board.getBoundingClientRect();return (e.clientY-r.top)/r.height*600}
  var grab=0;
  slider.addEventListener('pointerdown',function(e){
    slider.setPointerCapture(e.pointerId);slider.classList.add('drag');
    var y=units(e);
    grab=(Math.abs(y-ky)<=42)?ky-y:0;
    ky=Math.min(MAX,Math.max(MIN,y+grab));apply();
  });
  slider.addEventListener('pointermove',function(e){
    if(!slider.classList.contains('drag'))return;
    ky=Math.min(MAX,Math.max(MIN,units(e)+grab));apply();
  });
  function end(){slider.classList.remove('drag')}
  slider.addEventListener('pointerup',end);slider.addEventListener('pointercancel',end);
  slider.addEventListener('keydown',function(e){
    var d=0;
    if(e.key==='ArrowUp'||e.key==='ArrowLeft')d=-10;
    else if(e.key==='ArrowDown'||e.key==='ArrowRight')d=10;
    else if(e.key==='Home')ky=MIN;else if(e.key==='End')ky=MAX;else return;
    e.preventDefault();ky=Math.min(MAX,Math.max(MIN,ky+d));apply();
  });
  apply();
})();
</script>
</body>
</html>
